<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séptima Café - Punto de Venta</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBfgTqrdIPSQ07q688NaLY1y4WwxdMIbto&libraries=places,marker&callback=initMapa" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
     <script src="app.js"></script>
    
     
</head>
<body>

    <div class="header">
        <h1>MENU SEP7IMA</h1>
        <p>Pide en línea y recoge en mostrador</p>
    </div>

    <div class="main-layout">

        <div class="filtros-container">
            <div class="buscador-wrapper">
                <input 
                    type="text" 
                    id="buscador-menu" 
                    class="buscador-input" 
                    placeholder="Buscar producto..." 
                    onkeyup="buscarProducto()"
                >
            </div>
            <div id="categorias-filtro" class="categorias-wrapper"></div>
        </div>
        <div class="menu-container" id="menu-contenedor">
        </div>

        <div class="carrito-container">
            <h2>Tu Pedido</h2>
            <div id="lista-carrito">
                <p style="color: var(--text-muted); font-size: 14px;">El carrito está vacío.</p>
            </div>
            
            <div class="total-container">
                <span>Total</span>
                <span id="total-precio">$0.00</span>
            </div>

            <button type="button" class="btn btn-primary w-100" id="btn-enviar" onclick="iniciarCheckout()" disabled>
                Confirmar Pedido
            </button>
        </div>

    </div> 
<div class="modal fade" id="modal-resumen-pago" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5">Verifica tu pedido</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="lista-resumen-pedido" class="mb-4"></div>
                <h6 class="text-center text-muted mb-3">¿Cómo deseas pagar?</h6>
                <div class="d-flex flex-column gap-2">
                    <button class="btn btn-outline-success" onclick="abrirModalPago('efectivo')">Efectivo</button>
                    <button class="btn btn-outline-primary" onclick="abrirModalPago('tarjeta')">Tarjeta bancaria</button>
                    <button class="btn btn-outline-info" onclick="abrirModalPago('transferencia')"> Transferencia</button>
                </div>
            </div>
            <div class="modal-footer d-flex justify-content-between w-100">
    <button type="button" class="btn btn-link text-secondary text-decoration-none p-0" onclick="volverAEntrega()">
        ⬅ Volver a Entrega
    </button>
    <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">Cancelar Pedido</button>
</div>
        </div>
    </div>
</div>

<div class="modal fade" id="modal-efectivo"  tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5">Pago en Efectivo</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <h4 class="text-center mb-3">Total: <span id="total-efectivo">0.00</span></h4>
                
                <div class="d-flex justify-content-center mb-3">
                    <button class="btn btn-success"  onclick="marcarPagoExacto()">Pago Exacto</button>
                </div>

                <div class="mb-3">
                    <label class="form-label">Monto recibido</label>
                    <input type="text"  class="form-control" id="input-monto-recibido" placeholder="$0.00" onkeyup="calcularCambio()">
                </div>

                <div class="alert alert-info text-center">
                    <strong>Cambio a devolver: </strong> $<span id="label-cambio">0.00</span>
                </div>
            </div>
             
                <div class="modal-footer d-flex justify-content-between">
                       <button type="button" class="btn btn-link text-secondary text-decoration-none p-0" onclick="volverAResumenDesde('modal-efectivo')">
        ⬅ Volver a Métodos de Pago
    </button>
                       <button type="button" class="btn btn-primary" onclick="procesarPagoEfectivo()" id="btn-pagar-efectivo">Confirmar Pedido</button>
 
</div>

        </div>
    </div>
</div>


    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Completa tu Pedido</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
      
                <div class="modal-body">
                    <form id="form-checkout">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Moises" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellido" class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="apellido" placeholder="Ej. Garcia" required>
                            </div>
                        </div>
            
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" placeholder="9341024062" required>
                        </div>
            
                        <hr class="my-3">
                        <h6 class="mb-3 text-muted">Datos de tarjeta bancaria</h6>

                        <div class="row g-2">
                            <div class="col-12">
                                <label class="form-label">Número de Tarjeta</label>
                                <input type="text" id="card-number" class="form-control" placeholder="4242 4242 4242 4242" maxlength="19">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Mes (MM)</label>
                                <input type="text" id="card-month" class="form-control" placeholder="12" maxlength="2">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Año (AA)</label>
                                <input type="text" id="card-year" class="form-control" placeholder="28" maxlength="2">
                            </div>
                            <div class="col-12 mt-2">
                                <label class="form-label">Código de Seguridad (CVC)</label>
                                <input type="text" id="card-cvc" class="form-control" placeholder="123" maxlength="4">
                            </div>
                        </div>
                    </form>
                </div>
      
                <div class="modal-footer d-flex justify-content-between">
                    <button type="button" class="btn btn-link text-secondary text-decoration-none p-0" onclick="volverAResumenDesde('staticBackdrop')">
        ⬅ Volver a Métodos de Pago
    </button>
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="procesarPago()" id="btn-pagar">Confirmar y Pagar</button>
                </div>
            </div>
        </div>
    </div>
    <div id="flotante-movil" class="cart-flotante" onclick="scrollToCart()">
        <div class="cart-flotante-info">
            <span id="flotante-cantidad" class="badge-flotante">0</span>
            <span>Ver Pedido</span>
        </div>
        <span id="flotante-total" class="precio-flotante">$0.00</span>
    </div>

<div class="modal fade" id="modal-tipo-entrega" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5">Detalles de Entrega</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            
            <div class="d-flex justify-content-center gap-3 mb-4" id="botones-entrega">
                <button class="btn btn-outline-primary btn-animado" onclick="seleccionarEntrega('mostrador')">Recoger en Mostrador</button>
                <button class="btn btn-outline-success btn-animado" onclick="seleccionarEntrega('domicilio')">Envío a Domicilio</button>
            </div>
                <div id="seccion-domicilio" class="fade-anim" style="display: none;">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div id="mapa-google" style="height: 300px; width: 100%; background-color: #e9ecef; border-radius: 8px;">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-2">
                                <label class="form-label">Calle y Número</label>
                                <input type="text" class="form-control" id="input-calle" placeholder="Ej. Av. Universidad 123" onblur="actualizarMapaDesdeTexto()" oninput="validarCamposDomicilio()">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Colonia</label>
                                <input type="text" class="form-control" id="input-colonia" placeholder="Ej. Centro" onblur="actualizarMapaDesdeTexto()" oninput="validarCamposDomicilio()">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Código Postal</label>
                                <input type="text" class="form-control" id="input-cp" placeholder="XXXXX" onblur="actualizarMapaDesdeTexto()" oninput="validarCamposDomicilio()" maxlength="5" minlength="5">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Referencias</label>
                                <textarea class="form-control" id="input-referencias" rows="2" placeholder="Casa blanca con portón negro..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                <button type="button" class="btn btn-link text-secondary text-decoration-none p-0" id="btn-volver-entrega" style="display: none;" onclick="volverSeleccion()">
        ⬅ Volver
                </button>
                <button type="button" class="btn btn-primary" id="btn-continuar-pago" onclick="abrirModalResumenPago()" disabled>Continuar al Pago</button>
            </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
